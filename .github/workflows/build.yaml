name: build

on:
    push:
        branches: ["*"]
    pull_request:
        branches: [main]
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Setup node 24.12.0
              uses: actions/setup-node@v4
              with:
                  node-version: 24.12.0

            - name: npm install
              run: npm ci

            - name: npm run format:check
              run: npm run format:check

            - name: npm run lint
              run: npm run lint

            - name: npm run build:dist
              run: npm run build:dist

            - name: npm test
              run: npm test

    eslint-10:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Setup node 24.12.0
              uses: actions/setup-node@v4
              with:
                  node-version: 24.12.0

            - run: npm ci

            # Other development-only lint plugins do not yet support ESLint 10.
            # Override the test dependencies without changing the lockfile.
            - name: Install ESLint 10 test dependencies
              run: >-
                  npm install --no-save --package-lock=false --legacy-peer-deps
                  eslint@10.15.0
                  typescript-eslint@8.72.2
                  @typescript-eslint/eslint-plugin@8.72.2
                  @typescript-eslint/parser@8.72.2
                  @typescript-eslint/rule-tester@8.72.2
                  @typescript-eslint/utils@8.72.2

            - name: npm test
              run: npm test -- --run
